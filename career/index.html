<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BAX Careers</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,800&display=swap" rel="stylesheet"><style>
:root{--bg:#F7F8FF;--tx:#0A0F3C;--co:#2236E0;--li:#D6FF3D;--ink:#0A0F3C;--ft:#0A0F3C;--mu:#4b5280;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0A0F3C;--tx:#F7F8FF;--ft:#050828;--mu:#aab1e6;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0A0F3C;--tx:#F7F8FF;--ft:#050828;--mu:#aab1e6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Bricolage Grotesque",system-ui,sans-serif}
a{color:inherit;text-decoration:none;cursor:pointer}button,input,textarea{font:inherit}
.w{max-width:1160px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}
.top{background:var(--co);color:#fff}.nv{display:flex;gap:28px;align-items:center;padding:22px 0;flex-wrap:wrap}.nv .lg{font-size:30px;font-weight:800;letter-spacing:-1px;margin-right:auto}.nv .lg i{color:var(--li);font-style:normal}.nv a.l{font-weight:500;padding:4px 0;border-bottom:3px solid transparent}.nv a.on{border-color:var(--li);font-weight:800}
h1{font-size:clamp(40px,8.5vw,104px);line-height:.96;font-weight:800;letter-spacing:-.04em;margin:56px 0 20px;max-width:900px}
.sb{display:flex;gap:8px;max-width:640px;flex-wrap:wrap}.sb input{flex:1;min-width:220px;padding:16px 18px;border:0;font-size:18px;color:var(--ink);background:#fff}
.bt{background:var(--li);color:var(--ink);border:0;padding:16px 28px;font-weight:800;font-size:18px;cursor:pointer}.bt.d{background:var(--ink);color:#fff}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--li);outline-offset:2px}
h2{font-size:clamp(30px,5vw,48px);letter-spacing:-.04em;margin:0 0 20px;font-weight:800;line-height:1.05}
.jr{display:flex;align-items:center;gap:20px;width:100%;text-align:left;background:none;color:inherit;border:0;border-top:3px solid var(--tx);padding:24px 14px;cursor:pointer;flex-wrap:wrap}
.jr:hover{background:var(--li);color:var(--ink)}.jr h3{margin:0;font-size:clamp(22px,3.4vw,34px);font-weight:800;flex:1;letter-spacing:-.03em;min-width:220px}.jr span{width:190px}.jr b{white-space:nowrap}
.fc{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;align-items:center}.fc span{width:110px;color:var(--mu)}.ch{border:2px solid var(--tx);background:none;color:inherit;padding:6px 14px;cursor:pointer;font-weight:500}.ch.on{background:var(--li);color:var(--ink);border-color:var(--ink);font-weight:800}
.nw{display:flex;gap:24px;padding:14px 0;border-top:1px solid var(--mu);flex-wrap:wrap}.nw span{width:110px;color:var(--mu)}.nw b{flex:1;min-width:220px}
.cm{background:var(--li);color:var(--ink)}.cm .g{display:flex;gap:48px;align-items:flex-start;padding:72px 0;flex-wrap:wrap}.cm h2{flex:1;min-width:260px;font-size:clamp(30px,5vw,56px)}.fm{flex:1;min-width:280px;display:flex;flex-direction:column;gap:10px}
.fm input,.fm textarea{padding:15px;border:3px solid var(--ink);background:#fff;color:var(--ink);width:100%}.fm textarea{min-height:100px}.fm label{display:flex;gap:8px;font-size:14px}
footer{background:var(--ft);color:#cfd3ff;padding:28px 0}footer .r{display:flex;gap:24px;flex-wrap:wrap}footer .r span{margin-right:auto}footer details{margin-top:18px}footer summary{cursor:pointer}footer textarea{width:100%;min-height:70px;background:#0006;color:#fff;border:1px solid #fff4;margin:8px 0}
.ov{position:fixed;inset:0;background:#0009;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:16px;z-index:9}.ov>div{background:var(--bg);color:var(--tx);border:3px solid var(--tx);padding:26px;max-width:580px;width:100%}.ov .fm{max-width:none}.ov .fm input,.ov .fm textarea{background:var(--bg);color:var(--tx);border-color:var(--tx)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--li);color:var(--ink);padding:12px 18px;font-weight:800;z-index:20}
</style></head><body><div id="root"></div><div id="toast" hidden></div><script>
const $=i=>document.getElementById(i),val=i=>$(i)?.value||'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let F={jobs:[],news:[]};
let pg=location.hash.slice(1)||'home',fl={q:'',ty:[],d:[],loc:[]},aj=0;
addEventListener('hashchange',()=>{pg=location.hash.slice(1)||'home';aj=0;R();scrollTo(0,0)});
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,2800)}
const uq=k=>[...new Set(F.jobs.map(j=>j[k]))];
const jr=j=>`<button class="jr" onclick="aj=${j.id};R()"><h3>${esc(j.t)}</h3><span>${esc(j.d)}</span><span>${esc(j.loc)} · ${esc(j.ty)}</span><b>Ứng tuyển →</b></button>`;
const nw=n=>`<div class="nw"><span>${esc(n.d)}</span><b>${esc(n.t)}</b><div style="flex:2;min-width:220px">${esc(n.s)}</div></div>`;
const list=()=>F.jobs.filter(j=>(!fl.q||j.t.toLowerCase().includes(fl.q.toLowerCase()))&&['ty','d','loc'].every(k=>!fl[k].length||fl[k].includes(j[k])));
const fg=(k,t)=>`<div class="fc"><span>${t}</span>${uq(k).map(v=>`<button class="ch ${fl[k].includes(v)?'on':''}" data-v="${esc(v)}" onclick="tg('${k}',this.dataset.v)">${esc(v)}</button>`).join('')}</div>`;
const cm=()=>`<div class="cm"><div class="w g"><h2>Chưa thấy vị trí hợp? Để lại hồ sơ, chúng tôi sẽ tìm bạn.</h2><div class="fm"><button class="bt d" onclick="location.hash='community'">Vào cộng đồng nhân tài</button></div></div></div>`;
const P={
home:()=>`<div class="top"><div class="w">${nav()}<h1>Làm việc ở nơi ý tưởng được thử thật.</h1><p style="font-size:20px;max-width:560px;margin:0 0 32px">Con người và công nghệ là hai tài sản tạo nên BAX. Tìm vị trí hợp với bạn ngay bên dưới.</p><form class="sb" style="padding-bottom:88px" onsubmit="event.preventDefault();fl.q=val('q');location.hash='jobs'"><input id="q" aria-label="Tìm vị trí" placeholder="Bạn muốn làm vị trí nào?"><button class="bt">Tìm việc</button></form></div></div>
<div class="w" style="padding-top:72px;padding-bottom:24px"><h2>Đang mở</h2>${F.jobs.slice(0,5).map(jr).join('')||'<p>Hiện chưa có vị trí đang mở.</p>'}<div style="border-top:3px solid var(--tx)"></div><p><a href="#jobs"><b>Xem tất cả công việc →</b></a></p></div>
<div class="w" style="padding-top:40px;padding-bottom:72px"><h2 style="font-size:28px">Tin tuyển dụng</h2>${F.news.slice(0,4).map(nw).join('')||'<p>Chưa có tin mới.</p>'}</div>${cm()}`,
jobs:()=>`<div class="top"><div class="w">${nav()}<h1 style="font-size:clamp(36px,6vw,64px);margin:24px 0 20px">Tìm việc</h1><form class="sb" style="padding-bottom:48px" onsubmit="event.preventDefault();fl.q=val('q');R()"><input id="q" value="${esc(fl.q)}" aria-label="Tìm vị trí" placeholder="Tên vị trí"><button class="bt">Tìm</button></form></div></div>
<div class="w" style="padding-top:40px;padding-bottom:72px">${fg('ty','Loại công việc')}${fg('d','Ngành nghề')}${fg('loc','Địa điểm')}<h2 style="margin-top:32px">${list().length} vị trí</h2>${list().map(jr).join('')||'<p>Không có vị trí phù hợp. Hãy bỏ bớt bộ lọc hoặc vào cộng đồng nhân tài.</p>'}<div style="border-top:3px solid var(--tx)"></div></div>${cm()}`,
community:()=>`<div class="top"><div class="w">${nav()}<h1 style="font-size:clamp(36px,6vw,64px);margin:24px 0 56px">Cộng đồng nhân tài</h1></div></div><div class="cm"><div class="w g"><h2>Để lại hồ sơ giúp BAX liên hệ khi có vị trí phù hợp.</h2><div class="fm"><input id="tn" aria-label="Họ tên" placeholder="Họ tên"><input id="te" type="email" aria-label="Email" placeholder="Email"><textarea id="tc" aria-label="Giới thiệu" placeholder="Kỹ năng, kinh nghiệm, vị trí quan tâm"></textarea><label><input type="checkbox" id="tk" style="width:auto"> Tôi đồng ý cho BAX xử lý dữ liệu cá nhân theo Nghị định 13/2023/NĐ-CP.</label><button class="bt d" onclick="tal()">Tham gia cộng đồng</button></div></div></div>`};
const nav=()=>`<div class="nv"><a class="lg" href="#home">bax<i>.</i></a>${[['home','Trang chủ'],['community','Cộng đồng nhân tài'],['jobs','Tìm việc']].map(([k,t])=>`<a class="l ${pg==k?'on':''}" href="#${k}">${t}</a>`).join('')}</div>`;
function R(){const j=F.jobs.find(x=>x.id==aj);$('root').innerHTML=(P[pg]||P.home)()+`<footer><div class="w"><div class="r"><span>© 2026 BAX Careers</span><a href="#home">Chính sách bảo mật</a></div>
<form class="sb" style="margin-top:16px" onsubmit="event.preventDefault();rd()"><input id="de" type="email" aria-label="Email cần xoá dữ liệu" placeholder="Email cần xoá dữ liệu" style="font-size:15px;padding:10px 12px"><button class="bt d" style="background:#fff;color:var(--ink);font-size:15px;padding:10px 16px">Yêu cầu xoá dữ liệu cá nhân</button></form>
</div></footer>`+(j?`<div class="ov"><div><h2 style="font-size:32px">Ứng tuyển: ${esc(j.t)}</h2><p style="margin-top:-8px">${esc(j.jd)}</p><div class="fm"><input id="an" aria-label="Họ tên" placeholder="Họ tên"><input id="ae" type="email" aria-label="Email" placeholder="Email"><input id="ap" type="tel" aria-label="Số điện thoại" placeholder="Số điện thoại"><input id="ar" aria-label="Mã giới thiệu" placeholder="Mã giới thiệu (nếu có)"><textarea id="av" aria-label="Hồ sơ" placeholder="Kỹ năng, số năm kinh nghiệm, dự án nổi bật"></textarea><label><input type="checkbox" id="ak" style="width:auto"> Tôi đồng ý cho BAX xử lý dữ liệu cá nhân theo Nghị định 13/2023/NĐ-CP.</label><div style="display:flex;gap:8px"><button class="bt d" onclick="ap()">Gửi hồ sơ</button><button class="bt" style="background:none;border:3px solid var(--tx);color:var(--tx)" onclick="aj=0;R()">Đóng</button></div></div></div></div>`:'')}
function tg(k,v){const a=fl[k],i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);R()}
async function post(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Có lỗi xảy ra');return j}
async function ap(){const j=F.jobs.find(x=>x.id==aj);if(!val('an').trim()||!val('ae').trim()||!val('av').trim())return toast('Nhập họ tên, email và nội dung hồ sơ');if(!$('ak').checked)return toast('Bạn cần đồng ý xử lý dữ liệu cá nhân');try{await post('/public/applications',{jid:j.id,n:val('an'),e:val('ae'),p:val('ap'),ref:val('ar'),cv:val('av'),consent:true});aj=0;R();toast('Đã nhận hồ sơ. BAX sẽ phản hồi qua email.')}catch(x){toast(x.message)}}
async function tal(){if(!val('te')||!val('tn'))return toast('Nhập họ tên và email');if(!$('tk').checked)return toast('Bạn cần đồng ý xử lý dữ liệu cá nhân');try{await post('/public/talent-community',{n:val('tn'),e:val('te'),cv:val('tc'),consent:true});location.hash='home';toast('Cảm ơn bạn đã tham gia cộng đồng nhân tài')}catch(x){toast(x.message)}}
async function rd(){if(!val('de'))return;try{await post('/public/data-requests',{e:val('de')});R();toast('Đã ghi nhận yêu cầu xoá dữ liệu. BAX sẽ xử lý theo quy định.')}catch(x){toast(x.message)}}
async function boot(){try{const[a,b]=await Promise.all([fetch('/public/jobs').then(r=>r.json()),fetch('/public/news').then(r=>r.json())]);F={jobs:a,news:b}}catch(e){toast('Không kết nối được máy chủ')}R()}
boot();
</script></body></html>
