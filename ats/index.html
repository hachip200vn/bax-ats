<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BAX ATS nội bộ</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,800&display=swap" rel="stylesheet"><style>
:root{--bg:#F7F8FF;--sf:#fff;--tx:#0A0F3C;--mu:#4b5280;--bd:#cfd3f0;--ac:#2236E0;--on:#fff;--ac2:#E6E9FF;--li:#D6FF3D;--ok:#0b7a4a;--wr:#a14b00;--er:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0A0F3C;--sf:#141a52;--tx:#F7F8FF;--mu:#aab1e6;--bd:#2d3680;--ac:#8fa0ff;--on:#0A0F3C;--ac2:#1b2366;--ok:#4fd39a;--wr:#f0a04b;--er:#ff9a8f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0A0F3C;--sf:#141a52;--tx:#F7F8FF;--mu:#aab1e6;--bd:#2d3680;--ac:#8fa0ff;--on:#0A0F3C;--ac2:#1b2366;--ok:#4fd39a;--wr:#f0a04b;--er:#ff9a8f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px clamp(12px,3vw,28px);background:#2236E0;color:#fff}
header .lg{font-size:28px;font-weight:800;letter-spacing:-1px;margin-right:auto}header .lg i{color:var(--li);font-style:normal}
header select{background:#fff;color:#0A0F3C;border:0;border-radius:0;padding:8px 10px}
nav{display:flex;gap:2px;overflow-x:auto;padding:0 clamp(12px,3vw,28px);background:var(--sf);border-bottom:3px solid var(--tx)}
nav button{border:0;background:none;color:var(--tx);padding:12px 14px;cursor:pointer;font:inherit;font-weight:500;white-space:nowrap}
nav button.on{background:var(--li);color:#0A0F3C;font-weight:800}
main{padding:clamp(12px,3vw,28px);max-width:1320px;margin:auto}
h2{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:0 0 16px}h3{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:24px 0 8px}
.bx{background:var(--sf);border:2px solid var(--tx);padding:14px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{background:var(--bg);border:2px solid var(--tx);border-radius:0;padding:7px 9px;min-width:0}textarea{width:100%;min-height:70px}
button.b{background:var(--ac);color:var(--on);border:0;border-radius:0;padding:9px 16px;cursor:pointer;font-weight:800}button.b:hover{background:var(--li);color:#0A0F3C}
button.g{background:none;border:2px solid var(--tx);border-radius:0;padding:7px 12px;cursor:pointer}button.g:hover{background:var(--li);color:#0A0F3C}
button.r{background:none;border:2px solid var(--er);color:var(--er);border-radius:0;padding:7px 12px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tb{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-weight:500;font-size:12px;border-bottom:2px solid var(--tx)}
.tag{display:inline-block;background:var(--li);color:#0A0F3C;font-weight:800;padding:1px 8px;font-size:12px;margin:1px}
.ok{color:var(--ok)}.wr{color:var(--wr)}.er{color:var(--er)}.mu{color:var(--mu)}
.kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
.col{min-width:210px;flex:1;background:var(--ac2);padding:10px;min-height:180px}.col h4{margin:0 0 10px;font-size:14px;font-weight:800}
.cd{background:var(--sf);border:2px solid var(--tx);padding:9px;margin-bottom:8px;cursor:grab}.cd:hover{background:var(--li);color:#0A0F3C}.cd small{color:inherit;opacity:.75}
.mod{position:fixed;inset:0;background:#0009;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:16px;z-index:9}
.mod>div{background:var(--sf);border:3px solid var(--tx);padding:18px;max-width:780px;width:100%}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--li);color:#0A0F3C;font-weight:800;padding:10px 16px;z-index:20}
#letter{white-space:pre-wrap;border:2px dashed var(--tx);padding:12px;background:var(--bg)}
@media print{body *{visibility:hidden}#letter,#letter *{visibility:visible}#letter{position:absolute;left:0;top:0;width:100%;color:#000;background:#fff;border:0}}
</style></head><body><div id="root"></div><div id="toast" hidden></div><script>
const $=i=>document.getElementById(i),val=i=>$(i)?.value,TD=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sel=(id,o,v)=>`<select id="${id}">${o.map(x=>{x=Array.isArray(x)?x:[x,x];return`<option value="${esc(x[0])}"${x[0]==v?' selected':''}>${esc(x[1])}</option>`}).join('')}</select>`;
const inp=(id,l,t='text',v='',w=140)=>`<label>${l}<input id="${id}" type="${t}" value="${esc(v)}" style="width:${w}px"></label>`;
const ST=['Nộp hồ sơ','Test/Screening','Phỏng vấn vòng 1','Phỏng vấn vòng 2','Offer','Onboarding'];
const CH=['Career Site','TopCV','VietnamWorks','LinkedIn','Facebook'];
const USERS=[['Hà Phạm','HR Admin'],['Dung Lê','Recruiter'],['Cường Trần','Hiring Manager'],['An Nguyễn','Interviewer'],['Bình Võ','Interviewer'],['Lan Hoàng','CFO/CEO']];
const APR=['Hiring Manager','HR Admin','CFO/CEO'],APN=['Trưởng phòng','HRD','CFO/CEO'];
const TABS={'HR Admin':['req','job','news','kan','iv','of','pool','rep','adm'],Recruiter:['job','news','kan','iv','of','pool','rep'],'Hiring Manager':['req','kan','iv','rep'],Interviewer:['kan','iv'],'CFO/CEO':['req','of','rep']};
const TN={req:'Yêu cầu tuyển dụng',job:'Đăng tuyển',kan:'Ứng viên',iv:'Phỏng vấn',of:'Offer',pool:'Talent Pool',rep:'Báo cáo',adm:'Quản trị',news:'Tin tức tuyển dụng'};
const TPL={thanks:['Thư cảm ơn','Chào {n}, BAX cảm ơn bạn đã ứng tuyển vị trí {j}. Chúng tôi sẽ phản hồi sớm.'],invite:['Thư mời phỏng vấn','Chào {n}, BAX trân trọng mời bạn phỏng vấn vị trí {j}. Chi tiết lịch và link họp sẽ được gửi kèm.'],reject:['Thư từ chối','Chào {n}, cảm ơn bạn đã quan tâm vị trí {j}. Rất tiếc hồ sơ chưa phù hợp lần này; chúng tôi sẽ lưu hồ sơ cho cơ hội sau.'],reengage:['Re-engagement','Chào {n}, BAX có vị trí mới {j} phù hợp với hồ sơ của bạn. Bạn có muốn ứng tuyển không?']};
let S,U=0,mode='ats',tab='req',mod=null,drag=null,pf='';
const seed=()=>({dept:{'Công nghệ':{hc:4,bud:1200},'Kinh doanh':{hc:3,bud:400}},
reqs:[{id:1,t:'Senior Java Developer',d:'Công nghệ',hc:2,sal:45,step:3,st:0},{id:2,t:'Sales Executive',d:'Kinh doanh',hc:1,sal:18,step:1,st:0}],
jobs:[{id:1,rq:1,t:'Senior Java Developer',d:'Công nghệ',sk:'Java,Spring,SQL,Docker',me:3,jd:'Thiết kế và phát triển dịch vụ backend cho hệ thống nội bộ.',ch:['Career Site','TopCV'],cost:12}],
cands:[
{id:1,n:'Nguyễn Minh Khoa',e:'khoa@mail.vn',p:'0901000001',j:1,cv:'5 năm kinh nghiệm Java, Spring, SQL, Docker',src:'TopCV',st:2,mx:2,at:'2026-10-01',tags:['Senior Java'],m:[],sc:[],iv:[],ai:100},
{id:2,n:'Trần Thu Hà',e:'ha@mail.vn',p:'0901000002',j:1,cv:'2 năm kinh nghiệm Java, SQL',src:'Career Site',st:0,mx:0,at:'2026-10-20',tags:[],m:[],sc:[],iv:[],ai:55},
{id:3,n:'Lê Quốc Việt',e:'viet@mail.vn',p:'0901000003',j:1,cv:'4 năm kinh nghiệm Java, Spring, Docker',src:'LinkedIn',st:5,mx:5,at:'2026-09-01',hat:'2026-09-20',tags:[],m:[],sc:[],iv:[],ai:90,emp:'NV0001',of:{sal:40,start:'2026-10-01',st:'signed'},pre:{}}],
emp:[{c:'NV0001',n:'Lê Quốc Việt',d:'Công nghệ'}],log:[],del:[],integ:{'HRIS / Payroll':1,'Job Boards':1,'Calendar (Google/Outlook)':1,'Video Conference (Zoom/Teams)':1,'Email Service & SMS Brandname':1,'e-Signature':1},nid:10});
const ensure=()=>{S.news=S.news||[];S.talent=S.talent||[];S.del=S.del||[]};let rev=0,saving=0;
const save=()=>{saving=1;fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({rev,state:S})}).then(async r=>{const j=await r.json();if(r.status==409){toast('Dữ liệu vừa thay đổi ở nơi khác, đã tải lại');await load()}else rev=j.rev}).catch(()=>toast('Mất kết nối máy chủ')).finally(()=>saving=0)};
async function load(){const r=await(await fetch('/api/state')).json();rev=r.rev;if(!r.state){S=seed();ensure();save();R(1);return}S=r.state;ensure();R(1)}
async function poll(){if(saving||mod||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;try{const r=await(await fetch('/api/state')).json();if(r.state&&r.rev!=rev){S=r.state;rev=r.rev;ensure();R(1)}}catch(e){}}
const me=()=>USERS[U][0],role=()=>USERS[U][1],nid=()=>S.nid++;
const jb=i=>S.jobs.find(j=>j.id==i),cd=i=>S.cands.find(c=>c.id==i);
const lg=t=>{S.log.unshift(TD()+' · '+t);S.log=S.log.slice(0,40)};
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,2600)}
function score(j,cv){const sk=j.sk.split(',').map(s=>s.trim()).filter(Boolean),l=cv.toLowerCase(),ok=sk.filter(s=>l.includes(s.toLowerCase())),y=+((cv.match(/(\d+)\s*(năm|years?)/i)||[])[1]||0);return{t:Math.round(ok.length/(sk.length||1)*70+Math.min(y/(j.me||1),1)*30),ok,no:sk.filter(s=>!ok.includes(s)),y}}
function send(c,k,ch='Email'){const j=jb(c.j),t=TPL[k][1].replace('{n}',c.n).replace('{j}',j?.t||'');c.m.push({k:TPL[k][0],ch,t,d:TD()});lg(`${ch} “${TPL[k][0]}” → ${c.n}`)}
function warn(d,hc,sal){const x=S.reqs.filter(r=>r.d==d&&r.st!=-1),h=x.reduce((a,r)=>a+r.hc,0)+hc,b=x.reduce((a,r)=>a+r.hc*r.sal*12,0)+hc*sal*12,D=S.dept[d],w=[];if(h>D.hc)w.push(`vượt định biên (${h}/${D.hc})`);if(b>D.bud)w.push(`vượt ngân sách (${b}/${D.bud} triệu/năm)`);return w}
const slots=()=>{const o=[];let d=new Date();while(o.length<12){d.setDate(d.getDate()+1);if(d.getDay()%6)['09:00','10:00','14:00','15:00'].forEach(t=>o.push(d.toISOString().slice(0,10)+' '+t))}return o};
const busy=(p,s)=>[...(p+s)].reduce((a,c)=>a+c.charCodeAt(0),0)%4==0||S.cands.some(c=>c.iv.some(v=>v.by==p&&v.slot==s));
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function R(x){if(!x)save();const r=role(),tb=TABS[r];if(!tb.includes(tab))tab=tb[0];
$('root').innerHTML=`<header><b class="lg">bax<i>.</i> <span style="font-weight:500;font-size:15px">ATS nội bộ</span></b>${mode=='ats'?sel('usr',USERS.map((u,i)=>[i,u[0]+' · '+u[1]]),U).replace('<select','<select onchange="U=+this.value;R()"'):''}</header>`+(mode=='site'?site():`<nav>${tb.map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';R()">${TN[t]}</button>`).join('')}</nav><main>${V[tab]()}</main>`)+(mod?vm():'')}
const V={
req(){const w=r=>r.st==-1?'<span class="er">Bị từ chối</span>':r.step==3?'<span class="ok">Đã duyệt</span>':`Chờ ${APN[r.step]}`;
return`<h2>Yêu cầu tuyển dụng</h2><div class="bx row">${inp('rt','Vị trí','text','',180)}<label>Phòng ban${sel('rd',Object.keys(S.dept))}</label>${inp('rh','Số lượng','number','1',70)}${inp('rs','Lương (triệu/tháng)','number','20',90)}<button class="b" onclick="addReq()">Tạo đề xuất</button></div>
<div class="bx tb"><table><tr><th>Vị trí</th><th>Phòng</th><th>SL</th><th>Lương</th><th>Luồng duyệt: Trưởng phòng → HRD → CFO/CEO</th><th></th></tr>${S.reqs.map(r=>`<tr><td>${esc(r.t)}</td><td>${r.d}</td><td>${r.hc}</td><td>${r.sal}tr</td><td>${w(r)}${r.w?`<br><span class="wr">Cảnh báo: ${esc(r.w)}</span>`:''}</td><td>${r.st!=-1&&r.step<3&&role()==APR[r.step]?`<button class="b" onclick="appr(${r.id},1)">Duyệt</button> <button class="r" onclick="appr(${r.id},0)">Từ chối</button>`:''}</td></tr>`).join('')}</table></div>
<h3>Ngân sách & định biên theo phòng</h3><div class="bx tb"><table><tr><th>Phòng</th><th>Định biên</th><th>Đã đề xuất</th><th>Ngân sách năm</th><th>Đã dùng</th></tr>${Object.entries(S.dept).map(([d,x])=>{const q=S.reqs.filter(r=>r.d==d&&r.st!=-1);return`<tr><td>${d}</td><td>${x.hc}</td><td>${q.reduce((a,r)=>a+r.hc,0)}</td><td>${x.bud} tr</td><td>${q.reduce((a,r)=>a+r.hc*r.sal*12,0)} tr</td></tr>`}).join('')}</table></div>`},
job(){const ap=S.reqs.filter(r=>r.step==3&&!S.jobs.some(j=>j.rq==r.id)),ini=me().split(' ').map(x=>x[0]).join('');
return`<h2>Đăng tuyển đa kênh & Referral</h2>${ap.length?`<div class="bx row"><label>Yêu cầu đã duyệt${sel('jq',ap.map(r=>[r.id,r.t]))}</label>${inp('jk','Kỹ năng (cách nhau dấu phẩy)','text','',220)}${inp('jm','Kinh nghiệm tối thiểu (năm)','number','2',90)}<label>Địa điểm${sel('jl',['Thành phố Hồ Chí Minh','Thành phố Hà Nội','Tỉnh Gia Lai'])}</label><label>Loại${sel('jy',['Official','Collaborator'])}</label><label>Mô tả công việc<input id="jj" style="width:240px"></label><button class="b" onclick="addJob()">Tạo tin tuyển dụng</button></div>`:'<p class="mu">Chưa có yêu cầu đã duyệt nào cần tạo tin.</p>'}
${S.jobs.map(j=>`<div class="bx"><b>${esc(j.t)}</b> <span class="mu">· ${j.d} · ${esc(j.sk)} · từ ${j.me} năm</span><div class="row" style="margin-top:6px">${CH.map((c,k)=>`<label style="flex-direction:row;gap:4px"><input type="checkbox" id="c${j.id}_${k}"${j.ch.includes(c)?' checked':''}>${c}</label>`).join('')}${inp('cs'+j.id,'Chi phí (triệu)','number',j.cost,80)}<button class="b" onclick="pubJob(${j.id})">Đăng 1 thao tác lên các kênh đã chọn</button></div><div class="mu" style="margin-top:4px">Mã giới thiệu của bạn: <b>REF-${j.id}-${ini}</b></div></div>`).join('')}
<h3>Theo dõi thưởng giới thiệu</h3><div class="bx tb"><table><tr><th>Ứng viên</th><th>Mã</th><th>Trạng thái thưởng</th></tr>${S.cands.filter(c=>c.ref).map(c=>`<tr><td>${esc(c.n)}</td><td>${esc(c.ref)}</td><td>${c.hat?'<span class="ok">Đủ điều kiện thưởng</span>':'Đang chờ kết quả tuyển'}</td></tr>`).join('')||'<tr><td colspan=3 class="mu">Chưa có ứng viên dùng mã giới thiệu.</td></tr>'}</table></div>`},
kan(){const r=role(),cs=S.cands.filter(c=>!c.del&&!c.rej&&(!pf||c.j==pf)&&(r!='Interviewer'||c.iv.some(v=>v.by==me())));
return`<h2>Bảng tuyển dụng (kéo thả ứng viên qua các vòng)</h2><div class="row" style="margin-bottom:8px"><label>Vị trí${sel('pf',[['','Tất cả'],...S.jobs.map(j=>[j.id,j.t])],pf).replace('<select','<select onchange="pf=this.value;R()"')}</label></div><div class="kan">${ST.map((s,i)=>`<div class="col" ondragover="event.preventDefault()" ondrop="mv(${i})"><h4>${s} (${cs.filter(c=>c.st==i).length})</h4>${cs.filter(c=>c.st==i).map(c=>`<div class="cd" draggable="true" ondragstart="drag=${c.id}" onclick="mod=${c.id};R()"><b>${esc(c.n)}</b><br><small>${esc(jb(c.j)?.t)} · ${c.src}</small><br><span class="tag">AI ${c.ai}%</span></div>`).join('')}</div>`).join('')}</div>`},
iv(){const l=S.cands.flatMap(c=>c.iv.map(v=>({c,v})));return`<h2>Lịch phỏng vấn & đánh giá</h2><div class="bx tb"><table><tr><th>Ứng viên</th><th>Vòng</th><th>Người phỏng vấn</th><th>Thời gian</th><th>Phòng họp</th><th>Scorecard</th><th></th></tr>${l.filter(x=>role()!='Interviewer'||x.v.by==me()).map(({c,v})=>`<tr><td>${esc(c.n)}</td><td>${ST[v.r]}</td><td>${v.by}</td><td>${v.slot}</td><td>${esc(v.pl)}: <span class="mu">${esc(v.link)}</span></td><td>${c.sc.filter(s=>s.r==v.r).length}</td><td><button class="g" onclick="mod=${c.id};R()">Mở</button></td></tr>`).join('')||'<tr><td colspan=7 class="mu">Chưa có buổi phỏng vấn. Mở ứng viên để đặt lịch.</td></tr>'}</table></div>`},
of(){const l=S.cands.filter(c=>c.of);return`<h2>Offer</h2><div class="bx tb"><table><tr><th>Ứng viên</th><th>Lương</th><th>Ngày nhận việc</th><th>Trạng thái</th><th></th></tr>${l.map(c=>`<tr><td>${esc(c.n)}</td><td>${c.of.sal}tr</td><td>${c.of.start}</td><td>${{draft:'Chờ duyệt',approved:'Đã duyệt',sent:'Đã gửi',signed:'<span class="ok">Đã ký</span>'}[c.of.st]}</td><td><button class="g" onclick="mod=${c.id};R()">Mở</button></td></tr>`).join('')||'<tr><td colspan=5 class="mu">Chưa có offer. Mở ứng viên ở vòng Offer để tạo.</td></tr>'}</table></div>`},
pool(){const l=S.cands.filter(c=>c.pool&&!c.del);return`<h2>Talent Pool & CRM</h2><div class="bx tb"><table><tr><th>Ứng viên</th><th>Vị trí cũ</th><th>Tag</th><th></th></tr>${l.map(c=>`<tr><td>${esc(c.n)}<br><span class="mu">${esc(c.e)}</span></td><td>${esc(jb(c.j)?.t)}</td><td>${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</td><td><button class="g" onclick="mod=${c.id};R()">Mở</button></td></tr>`).join('')||'<tr><td colspan=4 class="mu">Chưa có hồ sơ trong kho. Thêm từ chi tiết ứng viên.</td></tr>'}</table></div>
<h3>Cộng đồng nhân tài (đăng ký từ Career Site)</h3><div class="bx">${S.talent.map(t=>`<div>${esc(t.n)} · ${esc(t.e)} <span class="mu">${esc(t.cv)}</span></div>`).join('')||'<span class="mu">Chưa có đăng ký.</span>'}</div><h3>Chiến dịch re-engagement</h3><div class="bx row"><label>Vị trí mới${sel('rj',S.jobs.map(j=>[j.id,j.t]))}</label>${inp('rm','Ngưỡng khớp (%)','number','50',90)}<button class="b" onclick="reeng()">Gửi email cho hồ sơ phù hợp</button></div>`},
rep(){const h=S.cands.filter(c=>c.hat),ch=S.cands.length,src={};S.cands.forEach(c=>{const s=src[c.src]??={n:0,a:0,h:0};s.n++;s.a+=c.ai;s.h+=c.hat?1:0});
const ps=USERS.filter(u=>u[1]=='Recruiter');return`<h2>Báo cáo & phân tích</h2><div class="row"><div class="bx"><div class="mu">Time-to-Hire</div><h2>${h.length?Math.round(h.reduce((a,c)=>a+days(c.at,c.hat),0)/h.length):'–'} ngày</h2></div><div class="bx"><div class="mu">Cost-per-Hire</div><h2>${h.length?(S.jobs.reduce((a,j)=>a+j.cost,0)/h.length).toFixed(1):'–'} triệu</h2></div><div class="bx"><div class="mu">Tổng ứng viên / đã tuyển</div><h2>${ch} / ${h.length}</h2></div></div>
<h3>Chất lượng theo kênh</h3><div class="bx tb"><table><tr><th>Kênh</th><th>Hồ sơ</th><th>AI điểm TB</th><th>Đã tuyển</th></tr>${Object.entries(src).map(([k,s])=>`<tr><td>${k}</td><td>${s.n}</td><td>${Math.round(s.a/s.n)}%</td><td>${s.h}</td></tr>`).join('')}</table></div>
<h3>Tỷ lệ chuyển đổi qua từng vòng</h3><div class="bx tb"><table><tr><th>Vòng</th><th>Đã đạt tới</th><th>Chuyển đổi từ vòng trước</th></tr>${ST.map((s,i)=>{const n=S.cands.filter(c=>c.mx>=i).length,p=i?S.cands.filter(c=>c.mx>=i-1).length:n;return`<tr><td>${s}</td><td>${n}</td><td>${p?Math.round(n/p*100):0}%</td></tr>`}).join('')}</table></div>
<h3>Năng suất Recruiter</h3><div class="bx tb"><table><tr><th>Recruiter</th><th>CV đã xử lý</th><th>Buổi phỏng vấn đã hoàn thành</th></tr>${ps.map(u=>`<tr><td>${u[0]}</td><td>${S.cands.filter(c=>c.by==u[0]).length+(S.prod?.[u[0]]||0)}</td><td>${S.cands.reduce((a,c)=>a+c.iv.filter(v=>v.sb==u[0]&&c.sc.some(s=>s.r==v.r)).length,0)}</td></tr>`).join('')}</table></div>`},
news(){return`<h2>Tin tức tuyển dụng (hiển thị trên Career Site)</h2><div class="bx row">${inp('nt','Tiêu đề','text','',240)}${inp('ns','Nội dung ngắn','text','',320)}<button class="b" onclick="addNews()">Đăng tin</button></div><div class="bx">${S.news.map(n=>`<div class="row" style="justify-content:space-between"><span><b>${esc(n.t)}</b> <span class="mu">${n.d} · ${esc(n.s)}</span></span><button class="r" onclick="delNews(${n.id})">Gỡ</button></div>`).join('')||'<span class="mu">Chưa có tin. Đăng tin rồi đồng bộ sang Career Site.</span>'}</div>`},
sync(){return`<h2>Đồng bộ với Career Site</h2><div class="bx"><b>1. Gửi tin tuyển dụng và tin tức sang Career Site</b><p class="mu">Chỉ các tin đã bật kênh “Career Site” trong tab Đăng tuyển được gửi. Sao chép gói rồi dán vào mục “Dành cho quản trị viên” ở chân trang Career Site.</p><textarea id="fd" readonly>${esc(JSON.stringify(feed()))}</textarea><button class="b" onclick="cp('fd')">Sao chép gói dữ liệu</button></div><div class="bx"><b>2. Nhận hồ sơ ứng tuyển từ Career Site</b><p class="mu">Dán gói hồ sơ lấy từ nút “Tạo gói hồ sơ gửi ATS” trên Career Site. Hồ sơ trùng sẽ bị bỏ qua.</p><textarea id="ia"></textarea><button class="b" onclick="impApps()">Nhập hồ sơ</button></div>`},
adm(){return`<h2>Quản trị hệ thống & bảo mật</h2><h3>Phân quyền RBAC</h3><div class="bx tb"><table><tr><th>Vai trò</th><th>Module được truy cập</th></tr>${Object.entries(TABS).map(([r,t])=>`<tr><td>${r}</td><td>${t.map(x=>TN[x]).join(', ')}</td></tr>`).join('')}</table></div>
<h3>Tích hợp hệ thống</h3><div class="bx tb"><table>${Object.entries(S.integ).map(([k,v])=>`<tr><td>${k}</td><td>${v?'<span class="ok">Đang kết nối</span>':'<span class="er">Tắt</span>'}</td><td><button class="g" onclick="S.integ['${k}']=${v?0:1};R()">${v?'Ngắt':'Kết nối'}</button></td></tr>`).join('')}</table></div>
<h3>Yêu cầu xoá dữ liệu cá nhân (Nghị định 13/2023/NĐ-CP)</h3><div class="bx">${S.del.map((d,i)=>`<div>${esc(d.e)} · ${d.done?'<span class="ok">Đã xoá</span>':`<button class="r" onclick="doDel(${i})">Xử lý xoá</button>`}</div>`).join('')||'<span class="mu">Chưa có yêu cầu.</span>'}</div>
<h3>Hồ sơ nhân sự đã chuyển sang HRIS</h3><div class="bx">${S.emp.map(e=>`<div>${e.c} · ${esc(e.n)} · ${e.d}</div>`).join('')}</div><h3>Nhật ký tích hợp (Email, SMS, Calendar, Job Board…)</h3><div class="bx">${S.log.map(l=>`<div class="mu">${esc(l)}</div>`).join('')||'Trống'}</div>`}};
function site(){const js=S.jobs.filter(j=>j.ch.includes('Career Site'));return`<main><div class="hero"><h1>Gia nhập BAX</h1><div>Chọn vị trí phù hợp và nộp hồ sơ trong vài phút.</div></div>${js.map(j=>`<div class="bx"><b>${esc(j.t)}</b> <span class="mu">· ${j.d}</span><p>${esc(j.jd)}</p>${j.sk.split(',').map(s=>`<span class="tag">${esc(s)}</span>`).join('')}<div style="margin-top:8px"><button class="b" onclick="pj=${j.id};R()">Ứng tuyển</button></div></div>`).join('')||'<p class="mu">Hiện chưa có vị trí đang mở.</p>'}
${window.pj?`<div class="bx"><h2>Ứng tuyển: ${esc(jb(pj).t)}</h2><div class="row">${inp('an','Họ tên','text','',180)}${inp('ae','Email','email','',180)}${inp('ap','Số điện thoại','tel','',130)}${inp('ar','Mã giới thiệu (nếu có)','text','',140)}</div><label style="margin-top:8px">Hồ sơ / CV (dán nội dung: kỹ năng, số năm kinh nghiệm)<textarea id="av"></textarea></label><label style="flex-direction:row;gap:6px;margin:8px 0"><input type="checkbox" id="ac">Tôi đồng ý cho BAX xử lý dữ liệu cá nhân theo Nghị định 13/2023/NĐ-CP.</label><button class="b" onclick="apply()">Gửi hồ sơ</button></div>`:''}
<div class="bx"><h3 style="margin-top:0">Quyền dữ liệu cá nhân</h3><div class="row">${inp('de','Email đã ứng tuyển','email','',220)}<button class="g" onclick="reqDel()">Yêu cầu xoá dữ liệu của tôi</button></div></div></main>`}
function vm(){const c=cd(mod),j=jb(c.j),a=score(j,c.cv),r=role(),own=c.sc.some(s=>s.by==me()),vs=c.sc.filter(s=>r=='HR Admin'||s.by==me()||c.sc.some(x=>x.by==me()&&x.r==s.r)),o=c.of,hr=['HR Admin','Recruiter'].includes(r);
const L=o?`Kính gửi ${c.n},\n\nBAX trân trọng mời bạn nhận việc vị trí ${j.t} (${j.d}).\nMức lương: ${o.sal} triệu VND/tháng.\nNgày nhận việc dự kiến: ${o.start}.\n\nVui lòng ký xác nhận Offer này.\n${o.sig?'Đã ký điện tử bởi '+o.sig+' ('+o.prov+')':''}`:'';
return`<div class="mod"><div><div class="row" style="justify-content:space-between"><h2>${esc(c.n)}</h2><button class="g" onclick="mod=null;R()">Đóng</button></div>
<div class="mu">${esc(c.e)} · ${esc(c.p)} · ${esc(j.t)} · ${c.src} · ${ST[c.st]}${c.ref?' · Mã GT: '+esc(c.ref):''}</div><p>${esc(c.cv)}</p>
<div class="bx">Điểm khớp JD: <b>${a.t}%</b> · Khớp: ${a.ok.join(', ')||'–'} · <span class="wr">Thiếu: ${a.no.join(', ')||'không'}</span> · ${a.y} năm KN (yêu cầu ${j.me})</div>
${hr?`<h3>Gửi thông báo tự động</h3><div class="row">${sel('mk',Object.entries(TPL).map(([k,v])=>[k,v[0]]))}${sel('mc',['Email','SMS'])}<button class="b" onclick="sm(${c.id})">Gửi</button></div>${c.m.map(m=>`<div class="mu">${m.d} · ${m.ch} · ${esc(m.k)}: ${esc(m.t)}</div>`).join('')}`:''}
${hr?`<h3>Đặt lịch phỏng vấn</h3><div class="row"><label>Người phỏng vấn${sel('ip',USERS.filter(u=>u[1]=='Interviewer'||u[1]=='Hiring Manager').map(u=>u[0]))}</label><label>Vòng${sel('ir',[[2,ST[2]],[3,ST[3]]])}</label><label>Lịch${sel('il',['Google Calendar','Outlook'])}</label><label>Họp${sel('ib',['Zoom','Google Meet','Teams'])}</label><label>Giờ trống${sel('is',slots().filter(s=>!busy(USERS[3][0],s)).map(s=>[s,s]))}</label><button class="b" onclick="addIv(${c.id})">Tạo lịch + link họp</button></div><div class="mu">Chỉ hiện khung giờ trống của An Nguyễn trên lịch; chọn người khác sẽ kiểm tra lại khi tạo.</div>`:''}
${c.iv.map(v=>`<div class="mu">${ST[v.r]} · ${v.by} · ${v.slot} · ${v.pl}: ${esc(v.link)}</div>`).join('')}
${['Interviewer','Hiring Manager'].includes(r)&&c.iv.length&&!own?`<h3>Phiếu đánh giá của bạn</h3><div class="row">${sel('sr',c.iv.map(v=>[v.r,ST[v.r]]))}${['Kỹ năng cứng','Kỹ năng mềm','Culture fit'].map((k,i)=>`<label>${k}${sel('s'+i,[1,2,3,4,5],3)}</label>`).join('')}${inp('sn','Nhận xét','text','',200)}<button class="b" onclick="sc(${c.id})">Nộp đánh giá</button></div>`:''}
${vs.length?`<h3>Đánh giá phỏng vấn</h3>${vs.map(s=>`<div>${s.by} · ${ST[s.r]}: cứng ${s.h}, mềm ${s.s}, culture ${s.c} — ${esc(s.n)}</div>`).join('')}`:c.sc.length?'<div class="mu">Nộp đánh giá của bạn để xem đánh giá của người phỏng vấn khác.</div>':''}
${hr&&c.st>=4?`<h3>Offer</h3>${o?`<div id="letter">${esc(L)}</div><div class="row" style="margin-top:6px">${o.st=='draft'?`<button class="b" onclick="of2(${c.id},'approved')">Duyệt offer</button>`:''}${o.st=='approved'?`<button class="b" onclick="of2(${c.id},'sent')">Gửi offer</button>`:''}${o.st=='sent'?`${sel('ep',['DocuSign','VNPT eSign'])}${inp('en','Ứng viên ký tên','text',c.n,160)}<button class="b" onclick="of2(${c.id},'signed')">Ký điện tử</button>`:''}<button class="g" onclick="print()">In offer</button></div>`:`<div class="row">${inp('os','Lương (triệu/tháng)','number','30',90)}${inp('od','Ngày nhận việc','date','',140)}<button class="b" onclick="mkOf(${c.id})">Tạo offer theo template</button></div>`}`:''}
${o?.st=='signed'?`<h3>Pre-onboarding</h3>${c.emp?`<div class="ok">Đã đồng bộ HRIS · Mã nhân viên ${c.emp}</div>`:`<div class="row">${inp('p1','CCCD','text',c.pre?.a)}${inp('p2','MST','text',c.pre?.b)}${inp('p3','BHYT','text',c.pre?.c)}${inp('p4','Tài khoản ngân hàng','text',c.pre?.d)}<button class="b" onclick="onb(${c.id})">Lưu & đồng bộ HRIS</button></div>`}`:''}
${hr?`<h3>Talent Pool</h3><div class="row">${inp('tg','Gắn tag','text','',160)}<button class="g" onclick="tag(${c.id})">Thêm tag & lưu vào Talent Pool</button><button class="r" onclick="rej(${c.id})">Từ chối ứng viên</button></div>${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}`:''}</div></div>`}
const done=()=>{R()};
function addReq(){const t=val('rt').trim(),d=val('rd'),hc=+val('rh'),sal=+val('rs');if(!t||!hc||!sal)return toast('Nhập đủ vị trí, số lượng, lương');const w=warn(d,hc,sal);S.reqs.push({id:nid(),t,d,hc,sal,step:0,st:0,w:w.join('; ')});if(w.length)toast('Cảnh báo: '+w.join('; '));R()}
function appr(id,ok){const r=S.reqs.find(x=>x.id==id);ok?r.step++:r.st=-1;lg(`${APN[r.step-(ok?1:0)]} ${ok?'duyệt':'từ chối'} đề xuất ${r.t}`);R()}
function addJob(){const r=S.reqs.find(x=>x.id==val('jq'));S.jobs.push({id:nid(),rq:r.id,t:r.t,d:r.d,sk:val('jk')||'',me:+val('jm')||1,jd:val('jj')||'',l:val('jl'),ty:val('jy'),ch:[],cost:0});R()}
function pubJob(id){const j=jb(id);j.ch=CH.filter((c,k)=>$(`c${id}_${k}`).checked);j.cost=+val('cs'+id)||0;j.ch.forEach(c=>lg(`Multiposting “${j.t}” → ${c}`));toast('Đã đăng lên: '+(j.ch.join(', ')||'không kênh nào'));R()}
function mv(s){const c=cd(drag);if(!c||c.st==s)return;if(s==5&&c.of?.st!='signed')return toast('Cần offer đã ký trước khi sang Onboarding');c.st=s;c.mx=Math.max(c.mx,s);c.by=me();if(role()=='Recruiter'){S.prod=S.prod||{};S.prod[me()]=(S.prod[me()]||0)+1}R()}
function apply(){const n=val('an').trim(),e=val('ae').trim();if(!n||!e||!val('av').trim())return toast('Nhập họ tên, email và nội dung CV');if(!$('ac').checked)return toast('Cần đồng ý xử lý dữ liệu cá nhân');const j=jb(pj),c={id:nid(),n,e,p:val('ap'),j:j.id,cv:val('av'),src:'Career Site',ref:val('ar').trim(),st:0,mx:0,at:TD(),tags:[],m:[],sc:[],iv:[],ai:score(j,val('av')).t};if(c.ref)c.src='Referral';S.cands.push(c);send(c,'thanks');pj=0;toast('Đã nộp hồ sơ. Thư cảm ơn đã được gửi qua email.');R()}
function reqDel(){const e=val('de').trim();if(!e)return;S.del.push({e});toast('Đã ghi nhận yêu cầu xoá dữ liệu');R()}
function doDel(i){const d=S.del[i];S.cands.forEach(c=>{if(c.e==d.e){Object.assign(c,{n:'Đã xoá',e:'',p:'',cv:'',tags:[],m:[],del:1})}});d.done=1;lg('Xoá dữ liệu cá nhân theo yêu cầu (NĐ 13/2023)');R()}
const feed=()=>({jobs:S.jobs.filter(j=>j.ch.includes('Career Site')).map(j=>({id:j.id,t:j.t,d:j.d,loc:j.l||'Thành phố Hồ Chí Minh',ty:j.ty||'Official',jd:j.jd,sk:j.sk})),news:S.news});
function cp(i){const e=$(i);e.select();try{navigator.clipboard.writeText(e.value)}catch(x){document.execCommand('copy')}toast('Đã sao chép')}
function addNews(){if(!val('nt').trim())return toast('Nhập tiêu đề');S.news.unshift({id:nid(),t:val('nt').trim(),s:val('ns'),d:TD()});lg('Đăng tin tức: '+val('nt'));R()}
function delNews(id){S.news=S.news.filter(n=>n.id!=id);R()}
function impApps(){try{const x=JSON.parse(val('ia'));let n=0;(x.a||[]).forEach(a=>{const j=jb(a.jid);if(!j||S.cands.some(c=>c.cid==a.id))return;const c={id:nid(),cid:a.id,n:a.n,e:a.e,p:a.p,j:j.id,cv:a.cv,src:a.ref?'Referral':'Career Site',ref:a.ref||'',st:0,mx:0,at:a.at||TD(),tags:[],m:[],sc:[],iv:[],ai:score(j,a.cv).t};S.cands.push(c);send(c,'thanks');n++});(x.t||[]).forEach(t=>{if(!S.talent.some(y=>y.e==t.e))S.talent.push(t)});(x.del||[]).forEach(e=>{if(!S.del.some(d=>d.e==e))S.del.push({e})});toast('Đã nhập '+n+' hồ sơ mới');R()}catch(e){toast('Gói dữ liệu không hợp lệ')}}
function sm(id){send(cd(id),val('mk'),val('mc'));toast('Đã gửi');R()}
function addIv(id){const c=cd(id),p=val('ip'),s=val('is');if(busy(p,s)&&!c.iv.some(v=>v.slot==s&&v.by==p)&&!(p==USERS[3][0]))return toast(p+' bận khung giờ này');const pl=val('ib'),rd=Math.random().toString(36).slice(2,11),link=pl=='Zoom'?'https://zoom.us/j/'+rd:pl=='Teams'?'https://teams.microsoft.com/l/'+rd:'https://meet.google.com/'+rd.slice(0,3)+'-'+rd.slice(3,7)+'-'+rd.slice(7);c.iv.push({r:+val('ir'),by:p,slot:s,pl,link,sb:me()});c.by=c.by||me();send(c,'invite');lg(`${val('il')}: đặt lịch ${p} ${s}; tạo link ${pl}`);R()}
function sc(id){const c=cd(id);c.sc.push({by:me(),r:+val('sr'),h:val('s0'),s:val('s1'),c:val('s2'),n:val('sn')});R()}
function mkOf(id){const c=cd(id);c.of={sal:+val('os'),start:val('od')||TD(),st:'draft'};R()}
function of2(id,s){const c=cd(id),o=c.of;if(s=='approved'&&!['HR Admin','CFO/CEO'].includes(role()))return toast('Chỉ HR Admin hoặc CFO/CEO duyệt offer');if(s=='signed'){o.sig=val('en');o.prov=val('ep');c.hat=TD();c.mx=Math.max(c.mx,4)}if(s=='sent')send(c,'invite');o.st=s;lg(`Offer ${c.n}: ${s}`);R()}
function onb(id){const c=cd(id);c.pre={a:val('p1'),b:val('p2'),c:val('p3'),d:val('p4')};if(!c.pre.a||!c.pre.b||!c.pre.c||!c.pre.d)return toast('Nhập đủ CCCD, MST, BHYT, ngân hàng');c.emp='NV'+String(S.emp.length+1).padStart(4,'0');S.emp.push({c:c.emp,n:c.n,d:jb(c.j).d});c.st=5;c.mx=5;lg('Đồng bộ HRIS: '+c.emp);R()}
function tag(id){const c=cd(id),t=val('tg').trim();if(t)c.tags.push(t);c.pool=true;R()}
function rej(id){const c=cd(id);c.rej=true;c.pool=true;send(c,'reject');mod=null;R()}
function reeng(){const j=jb(val('rj')),m=+val('rm'),l=S.cands.filter(c=>c.pool&&!c.del&&score(j,c.cv).t>=m);l.forEach(c=>{c.j==j.id||0;const t=c.j;c.j=j.id;send(c,'reengage');c.j=t});toast(`Đã gửi email cho ${l.length} hồ sơ`);R()}
load();setInterval(poll,4000);
</script></body></html>
